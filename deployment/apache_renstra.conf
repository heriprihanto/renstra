# ==============================================================================
# Apache Reverse Proxy & VirtualHost Configuration for RENSTRA
# Target URL: https://monevrkpd.tegalkota.go.id/renstra
# ==============================================================================
#
# Pastikan modul Apache berikut telah aktif:
#   sudo a2enmod proxy proxy_http rewrite ssl headers
#   sudo systemctl restart apache2
# ==============================================================================

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName monevrkpd.tegalkota.go.id

    # --------------------------------------------------------------------------
    # 1. Reverse Proxy ke Backend FastAPI Uvicorn (Port 7878)
    # Catatan: Aturan ProxyPass harus diletakkan SEBELUM Alias /renstra
    # --------------------------------------------------------------------------
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Forwarded-Prefix "/renstra"

    # Forward API calls
    ProxyPass /renstra/api http://127.0.0.1:7878/api
    ProxyPassReverse /renstra/api http://127.0.0.1:7878/api

    # Forward Dokumentasi OpenAPI / Swagger UI
    ProxyPass /renstra/docs http://127.0.0.1:7878/docs
    ProxyPassReverse /renstra/docs http://127.0.0.1:7878/docs
    ProxyPass /renstra/openapi.json http://127.0.0.1:7878/openapi.json
    ProxyPassReverse /renstra/openapi.json http://127.0.0.1:7878/openapi.json

    # --------------------------------------------------------------------------
    # 2. Frontend Vue 3 Single Page Application (Static dist)
    # Ganti path folder jika dipindahkan ke /var/www/html/renstra/dist
    # --------------------------------------------------------------------------
    Alias /renstra /home/herry/1_Project/2026/RENSTRA_PERUBAHAN/Frontend/dist

    <Directory "/home/herry/1_Project/2026/RENSTRA_PERUBAHAN/Frontend/dist">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Fallback rewrite untuk vue-router HTML5 History Mode
        RewriteEngine On
        RewriteBase /renstra/
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /renstra/index.html [L]
    </Directory>

    # Log files
    ErrorLog ${APACHE_LOG_DIR}/renstra_error.log
    CustomLog ${APACHE_LOG_DIR}/renstra_access.log combined
</VirtualHost>
</IfModule>

